[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symbolic-re"
version = "1.0.0"
description = "Explainable Neuro-Symbolic Requirements Classification with ISO/IEC 25010 Quality Constraints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Umer Tanveer", email = "umer.tanveer@mail.au.edu.pk" },
    { name = "Hashim Ali" },
    { name = "Raja Sarath Kumar Boddu" }
]
keywords = [
    "requirements-engineering",
    "neuro-symbolic-ai",
    "iso-iec-25010",
    "ears-syntax",
    "class-imbalance",
    "sentence-bert",
    "explainable-ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.2",
    "imbalanced-learn>=0.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0"
]

[project.scripts]
neuro-re = "main:cli"

[tool.setuptools.packages.find]
include = ["data*", "symbolic*", "neuro*", "evaluation*", "diagnostics*"]
